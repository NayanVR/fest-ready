---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-api
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [shop]
  selector:
    matchLabels:
      app: shop-api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: partner-mock
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [providers]
  selector:
    matchLabels:
      app: partner-mock
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: delivery-availability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: delivery
      rules:
        - alert: DeliveryAvailabilityLow
          expr: |
            sum(rate(shop_orders_total{mode="delivery",result="error"}[1m]))
              / sum(rate(shop_orders_total{mode="delivery",result=~"success|error"}[1m])) > 0.05
          for: 1m
        # Extra shop alerts (routed to no receiver; only DeliveryAvailabilityLow reaches NudgeBee and the controller).
        # They give the playbook wizard real alerts to choose from and don't fire in the normal demo.
        - alert: PickupAvailabilityLow
          expr: |
            sum(rate(shop_orders_total{mode="pickup",result="error"}[1m]))
              / sum(rate(shop_orders_total{mode="pickup",result=~"success|error"}[1m])) > 0.05
          for: 1m
          labels: {severity: warning}
          annotations: {summary: "More than 5% of pickup orders fail"}
        - alert: CourierDispatchSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(courier_dispatch_duration_seconds_bucket[5m]))) > 1
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "p95 courier dispatch latency above 1 s"}
        - alert: DeliveryFlagMostlyOff
          expr: |
            sum(rate(shop_delivery_flag_evaluations_total{value="false"}[5m]))
              / sum(rate(shop_delivery_flag_evaluations_total[5m])) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Home delivery is switched off for most customers"}
