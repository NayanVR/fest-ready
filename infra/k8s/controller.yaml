apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: shop
  labels: {app: controller}
spec:
  replicas: 1
  selector:
    matchLabels: {app: controller}
  template:
    metadata:
      labels: {app: controller}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
      - name: controller
        image: controller:dev
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 4100}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
        env:
        - name: SHOP_URL
          value: "http://shop-api.shop"
        - name: PARTNER_URL
          value: "http://partner-mock.providers"
        - name: PROMETHEUS_URL
          value: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
        - name: DB_PATH
          value: "/data/controller.db"
        - name: PLAYBOOK_DIR
          value: "./playbooks"
        - name: PORT
          value: "4100"
        - name: ADMIN_SECRET
          valueFrom:
            secretKeyRef: {name: app-secrets, key: ADMIN_SECRET}
        - name: FLAGSMITH_MGMT_TOKEN
          valueFrom:
            secretKeyRef: {name: app-secrets, key: FLAGSMITH_MGMT_TOKEN}
        - name: FLAGSMITH_PROJECT_ID
          valueFrom:
            secretKeyRef: {name: app-secrets, key: FLAGSMITH_PROJECT_ID}
        - name: FLAGSMITH_ENV_ID
          valueFrom:
            secretKeyRef: {name: app-secrets, key: FLAGSMITH_ENV_ID}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: shop
  labels: {app: controller}
spec:
  type: NodePort
  selector: {app: controller}
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30410
