apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: shop
  labels: {app: dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dashboard
        image: dashboard:dev
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 3000}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
        env:
        - name: SHOP_URL
          value: "http://shop-api.shop"
        - name: CONTROLLER_URL
          value: "http://controller.shop"
        - name: DEMO_PROVIDERS
          value: "a,b,c"
        - name: PORT
          value: "3000"
        - name: ADMIN_SECRET
          valueFrom:
            secretKeyRef: {name: app-secrets, key: ADMIN_SECRET}
        - name: SARVAM_API_KEY
          valueFrom:
            secretKeyRef: {name: app-secrets, key: SARVAM_API_KEY, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: shop
  labels: {app: dashboard}
spec:
  type: NodePort
  selector: {app: dashboard}
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30300
